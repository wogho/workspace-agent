<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Workspace Agent portfolio architecture</title>
  <desc id="desc">A visual map connecting AI employees, workflow automation, browser workers, and the PostgreSQL source of truth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1380" cy="90" r="210" fill="#38bdf8" opacity="0.08"/>
  <circle cx="180" cy="500" r="260" fill="#c084fc" opacity="0.08"/>
  <path d="M0 430 C250 350 390 520 650 430 S1130 330 1600 440" fill="none" stroke="#93c5fd" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M0 470 C260 390 400 560 690 455 S1140 370 1600 480" fill="none" stroke="#c4b5fd" stroke-opacity="0.1" stroke-width="2"/>

  <text x="92" y="112" fill="#e0f2fe" font-family="Arial, Noto Sans KR, sans-serif" font-size="62" font-weight="700">Workspace Agent</text>
  <text x="96" y="158" fill="#bae6fd" font-family="Arial, Noto Sans KR, sans-serif" font-size="22">Role-based AI operations architecture</text>
  <rect x="96" y="190" width="220" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="96" y="238" fill="#cbd5e1" font-family="Arial, Noto Sans KR, sans-serif" font-size="18">Reasoning, state, automation, and human decisions</text>
  <text x="96" y="266" fill="#cbd5e1" font-family="Arial, Noto Sans KR, sans-serif" font-size="18">are separated into explicit technical boundaries.</text>

  <g stroke="#93c5fd" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M390 386 C500 302 555 302 660 386"/>
    <path d="M820 386 C930 302 982 302 1092 386"/>
    <path d="M660 386 C720 350 760 350 820 386"/>
    <path d="M1092 386 C1160 350 1210 350 1278 386"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="390" cy="386" r="6"/>
    <circle cx="660" cy="386" r="6"/>
    <circle cx="820" cy="386" r="6"/>
    <circle cx="1092" cy="386" r="6"/>
    <circle cx="1278" cy="386" r="6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="330" width="220" height="118" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <rect x="548" y="330" width="224" height="118" rx="18" fill="#111827" stroke="#818cf8" stroke-width="2"/>
    <rect x="824" y="330" width="224" height="118" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
    <rect x="1100" y="330" width="220" height="118" rx="18" fill="#111827" stroke="#c084fc" stroke-width="2"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, Noto Sans KR, sans-serif" text-anchor="middle">
    <text x="390" y="374" font-size="24" font-weight="700">Hermes</text>
    <text x="390" y="404" font-size="15" fill="#bae6fd">17 role-based AI employees</text>
    <text x="660" y="374" font-size="24" font-weight="700">Django API</text>
    <text x="660" y="404" font-size="15" fill="#c7d2fe">state and permission boundary</text>
    <text x="936" y="374" font-size="24" font-weight="700">PostgreSQL</text>
    <text x="936" y="404" font-size="15" fill="#ddd6fe">source of truth and audit</text>
    <text x="1210" y="374" font-size="24" font-weight="700">Automation</text>
    <text x="1210" y="404" font-size="15" fill="#e9d5ff">n8n and browser workers</text>
  </g>
  <text x="96" y="512" fill="#94a3b8" font-family="Arial, Noto Sans KR, sans-serif" font-size="15">Portfolio-safe overview · secrets, customer data, and business playbooks are intentionally excluded</text>
</svg>
