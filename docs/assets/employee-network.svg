<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">AI employee organization map</title>
  <desc id="desc">A visual map of the seven Smartstore teams surrounding a central group of 17 AI employees.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="28" fill="url(#panel)"/>
  <text x="70" y="78" fill="#0f172a" font-family="Arial, Noto Sans KR, sans-serif" font-size="40" font-weight="700">17 AI employees, one operating model</text>
  <text x="72" y="112" fill="#475569" font-family="Arial, Noto Sans KR, sans-serif" font-size="18">Every role has a workspace contract, a bounded tool surface, and an explicit handoff line.</text>

  <g stroke="#cbd5e1" stroke-width="3" fill="none">
    <path d="M700 290 L350 190"/>
    <path d="M700 290 L570 160"/>
    <path d="M700 290 L830 160"/>
    <path d="M700 290 L1050 190"/>
    <path d="M700 290 L1080 390"/>
    <path d="M700 290 L830 440"/>
    <path d="M700 290 L570 440"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="700" cy="290" r="116" fill="#111827"/>
    <circle cx="700" cy="290" r="98" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
  </g>
  <text x="700" y="278" text-anchor="middle" fill="#f8fafc" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700">17 AI</text>
  <text x="700" y="316" text-anchor="middle" fill="#c7d2fe" font-family="Arial, Noto Sans KR, sans-serif" font-size="22">employees</text>

  <g filter="url(#soft)" font-family="Arial, Noto Sans KR, sans-serif" text-anchor="middle">
    <g>
      <rect x="245" y="145" width="210" height="86" rx="16" fill="#dbeafe"/>
      <text x="350" y="181" fill="#1e3a8a" font-size="20" font-weight="700">Command</text>
      <text x="350" y="208" fill="#1e40af" font-size="14">4 roles · review</text>
    </g>
    <g>
      <rect x="465" y="116" width="210" height="86" rx="16" fill="#dcfce7"/>
      <text x="570" y="152" fill="#14532d" font-size="20" font-weight="700">Platform</text>
      <text x="570" y="179" fill="#166534" font-size="14">1 role · catalog</text>
    </g>
    <g>
      <rect x="725" y="116" width="210" height="86" rx="16" fill="#fef3c7"/>
      <text x="830" y="152" fill="#713f12" font-size="20" font-weight="700">Sales</text>
      <text x="830" y="179" fill="#92400e" font-size="14">2 roles · observe</text>
    </g>
    <g>
      <rect x="945" y="145" width="210" height="86" rx="16" fill="#fce7f3"/>
      <text x="1050" y="181" fill="#831843" font-size="20" font-weight="700">Infrastructure</text>
      <text x="1050" y="208" fill="#9d174d" font-size="14">2 roles · operate</text>
    </g>
    <g>
      <rect x="975" y="347" width="210" height="86" rx="16" fill="#ede9fe"/>
      <text x="1080" y="383" fill="#4c1d95" font-size="20" font-weight="700">Purchase</text>
      <text x="1080" y="410" fill="#5b21b6" font-size="14">5 roles · coordinate</text>
    </g>
    <g>
      <rect x="725" y="397" width="210" height="86" rx="16" fill="#cffafe"/>
      <text x="830" y="433" fill="#164e63" font-size="20" font-weight="700">Accounting</text>
      <text x="830" y="460" fill="#155e75" font-size="14">2 roles · reconcile</text>
    </g>
    <g>
      <rect x="465" y="397" width="210" height="86" rx="16" fill="#ffedd5"/>
      <text x="570" y="433" fill="#7c2d12" font-size="20" font-weight="700">Bookkeeping</text>
      <text x="570" y="460" fill="#9a3412" font-size="14">1 role · prepare</text>
    </g>
  </g>
</svg>
