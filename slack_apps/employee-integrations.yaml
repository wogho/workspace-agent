# 직원별 Slack 앱과 Hermes Socket Mode 연동 초안
# 이 파일에는 토큰이나 Slack 사용자 ID를 넣지 않는다.

version: 1
purpose: Smartstore 17명 직원별 Slack 앱 생성 및 Hermes Socket Mode 연동 초안
workspace_url: https://w1618802361-n9r230120.slack.com
import_order: 각 직원 디렉터리의 app-manifest.yaml을 Slack App Manifest에 한 번씩 가져온다.
secrets_policy: 토큰과 사용자 ID는 이 파일에 기록하지 않고 각 Hermes 프로필 .env에 직접 등록한다.
defaults:
  socket_mode: true
  allow_all_users: false
  manifest_options:
  - no-assistant
  bot_token_scope_env: SLACK_BOT_TOKEN
  app_token_scope_env: SLACK_APP_TOKEN
employees:
- id: ss-coo
  team: 지휘본부
  role: COO
  app_name: COO (ss-최고운영)
  app_manifest: ss-coo/app-manifest.yaml
  profile: ss-coo
  workspace: /home/ubuntu/.hermes/workspace-ss-coo
  channel_id: C0C307MF38C
  socket_mode:
    enabled: true
    bot_token_env: SLACK_BOT_TOKEN
    app_token_env: SLACK_APP_TOKEN
  profile_env_mapping:
    SLACK_BOT_TOKEN: ${SLACK_SS_COO_BOT_TOKEN}
    SLACK_APP_TOKEN: ${SLACK_SS_COO_APP_TOKEN}
    SLACK_ALLOW_ALL_USERS: 'false'
    SLACK_ALLOWED_USERS: ${SLACK_SS_COO_ALLOWED_USERS}
  gateway_start: hermes -p ss-coo gateway start
  gateway_status: hermes -p ss-coo gateway status
- id: ss-cto
  team: 지휘본부
  role: CTO
  app_name: CTO (ss-최고기술)
